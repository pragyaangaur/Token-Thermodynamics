name: reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the analysis requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reproduce the headline melting-law result
        run: python repro.py

      - name: Check the thermodynamics against analytic results
        run: python src/validate.py
